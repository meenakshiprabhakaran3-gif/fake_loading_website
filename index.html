<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Totally Legit Loading</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <div class="emoji">⏳</div>

        <h1 id="title">Please Wait...</h1>

        <div class="progress-container">
            <div id="progress-bar"></div>
        </div>

        <div id="percentage">0%</div>

        <p id="message">Initializing...</p>

        <div id="result"></div>

        <button id="retry" onclick="startLoading()">
            🔄 Try Again
        </button>

        <p class="attempts">
            Attempts: <span id="attempts">0</span>
        </p>

    </div>

    <script src="script.js"></script>

</body>

</html>
